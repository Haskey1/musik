name: android

# Builds the Kotlin/Compose client in android/ and publishes a signed APK as an
# artifact. Install it on the phone directly. Signing uses one permanent key from
# GitHub Secrets, so every new build installs over the previous one:
#   ANDROID_KEYSTORE_BASE64   keystore file, base64
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password (optional, defaults to the keystore password)
# The server address comes from the MUSIK_SERVER_URL repository variable.
on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK подписан debug-ключом. Задай секреты подписи, иначе следующие версии не встанут поверх."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/musik-release.jks"
          echo "MUSIK_KEYSTORE=$RUNNER_TEMP/musik-release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          MUSIK_SERVER_URL: ${{ vars.MUSIK_SERVER_URL }}
          MUSIK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MUSIK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MUSIK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build
          if [ -z "$MUSIK_SERVER_URL" ]; then
            echo "::warning::Переменная репозитория MUSIK_SERVER_URL пуста — экран входа будет спрашивать адрес сервера."
          fi
          status=0
          gradle assembleRelease --console=plain --no-daemon > build/gradle.log 2>&1 || status=$?
          tail -n 40 build/gradle.log
          # Errors as annotations, readable without downloading the log:
          # Kotlin compiler (e: file:///…/X.kt:12:5 message), then Gradle's summary.
          : > build/errors.txt
          grep -E '^e: ' build/gradle.log | sed -E "s#^e: (file://)?${GITHUB_WORKSPACE}/([^:]+):([0-9]+):([0-9]+) (.*)\$#file=\2,line=\3,col=\4::\5#" \
            | sort -u >> build/errors.txt || true
          grep -E '^(ERROR|AAPT: error|.*error: )' build/gradle.log | grep -v '^e: ' | sed "s#${GITHUB_WORKSPACE}/##g" \
            | sort -u | sed 's#^#::#' >> build/errors.txt || true
          if [ "$status" -ne 0 ]; then
            awk '/^\* What went wrong:/{f=1;next} /^\* Try:/{f=0} f && NF' build/gradle.log | head -n 8 \
              | tr '\n' ' ' | sed 's#^#::Gradle: #' >> build/errors.txt
            echo >> build/errors.txt
          fi
          sed -n '1,10p' build/errors.txt | while IFS= read -r l; do [ -n "$l" ] && echo "::error $l"; done
          echo "Всего ошибок: $(grep -c . build/errors.txt || true)"
          exit $status

      # GitHub keeps 10 error annotations per step; the next steps show the rest.
      - name: More errors (11-20)
        if: failure()
        run: sed -n '11,20p' build/errors.txt 2>/dev/null | while IFS= read -r l; do [ -n "$l" ] && echo "::error $l"; done; true
      - name: More errors (21-30)
        if: failure()
        run: sed -n '21,30p' build/errors.txt 2>/dev/null | while IFS= read -r l; do [ -n "$l" ] && echo "::error $l"; done; true

      - name: Package
        id: pkg
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          name="musik-android-${GITHUB_RUN_NUMBER}.apk"
          cp "$apk" "build/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          cert=$("$signer" verify --print-certs "build/$name" | grep -m1 'SHA-256' | sed 's/.*: //')
          {
            echo "### APK: \`$name\`"
            echo "Подпись (SHA-256 сертификата): \`$cert\`"
            echo "Сервер: ${{ vars.MUSIK_SERVER_URL != '' && 'задан из MUSIK_SERVER_URL' || 'не задан' }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::APK ${name} подписан сертификатом ${cert:0:23}…"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: android/build/${{ steps.pkg.outputs.name }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/build/${{ steps.pkg.outputs.name }}
