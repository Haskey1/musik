name: debug-go
on:
  push:
    branches: [claude/debug-go-tests]
jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: player/go.mod
      - name: Test on SQLite
        run: |
          set +e
          go test ./... > /tmp/out.txt 2>&1
          code=$?
          grep -E -- '--- FAIL|^FAIL|panic:|_test.go:[0-9]+:' /tmp/out.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code
