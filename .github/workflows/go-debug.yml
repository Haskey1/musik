name: go-debug
on:
  push:
    branches: [claude/radio-variety]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: player/go.mod
      - name: go test (failures as annotations)
        run: |
          set +e
          go test -count=1 ./... > /tmp/out.txt 2>&1
          code=$?
          grep -nE -- '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+|\.go:[0-9]+:[0-9]+:' /tmp/out.txt > /tmp/fail.txt
          sed -n '1,10p'  /tmp/fail.txt | while IFS= read -r l; do echo "::error::$l"; done
          sed -n '11,20p' /tmp/fail.txt | while IFS= read -r l; do echo "::warning::$l"; done
          sed -n '21,30p' /tmp/fail.txt | while IFS= read -r l; do echo "::notice::$l"; done
          exit $code
